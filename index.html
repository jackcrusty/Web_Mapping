<!DOCTYPE HTML>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
<title>To be annouced</title>

  <!-- Leaflet Framework per externem Link einbetten (Bitte beachten Sie die DSGVO beim Laden von externen Inhalten) -->
  <!-- 1. CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="" 
    crossorigin="">
   
  <!-- 2. Javascript (immer nach dem CSS) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="" 
    crossorigin="">
    </script>

</head>

<body>

    <header class="text-center">
        <h1>Stockholm - Sehenswürdigkeiten</h1>
    </header>
  
     <!-- DIV Container zur Darstellung der OSM Karte -->
    <div id="map"></div>

    <script>
        // OSM Lat, Lng und Zoomstufe bei Seitenaufruf festlegen
        let map = L.map('map').setView([59.3273, 18.0935], 15);

        // Kostenlose OSM-Tiles verwenden und sie per CSS dunkel darstellen
        let layer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            maxZoom: 19,
        }).addTo(map);

        
        let polygon = L.polygon([
            [59.32925013778496, 18.089429795624344],
            [59.3301630754261, 18.094571211240527],
            [59.32798858358916, 18.096686350576299],
            [59.326544378527856, 18.096165700893646],
            [59.324718284267753, 18.097597487520936],
            [59.324353053641211, 18.095970457262649],
            [59.326809984064525, 18.09444104881986],
            [59.327639987986885, 18.090373473174147]
        ], {
            color: '#0066cc',       // Farbe der Umrandung
            weight: 3,              // Breite der Umrandung
            opacity: 1,             // Transparenz der Umrandung
            fillColor: '#3399ff',   // Füllfarbe
            fillOpacity: 0.50       // Transparenz der Füllung
        }).addTo(map);


        // OSM Webfeature: Marker setzen
    
         let vikinger = L.marker([59.32664644130814,18.09529801705559]); // Lat, Lng
          vikinger.bindPopup("Vikinger Museum"); // Popup-Text 

          let abba = L.marker([59.3249129809774,18.096670365075298]);
          abba.bindPopup("ABBA Museum");
          abba.openPopup(); // Popup bei Seitenaufruf öffnen

          let nordische = L.marker([59.32917428151353,18.093811078127125]);
          nordische.bindPopup("Nordische Museum");

          let vasa = L.marker([59.327858209435334,18.09163163470899]);
          vasa.bindPopup("Vasa Museum");

          let friedhofMarker = L.marker([59.32808996966788,18.09386487999285]);
          friedhofMarker.bindPopup("Friedhof");

          

      let museenLayer = L.layerGroup([vikinger, abba, nordische, vasa]).addTo(map);
      let friedhofLayer = L.layerGroup([friedhofMarker]).addTo(map);


      let layerControl = L.control.layers(null, {
          "Museen": museenLayer,
          "Friedhof": friedhofLayer,
      }).addTo(map);

    </script>

<footer class="text-center"><p><a href="html/impressum.html">Impressum</a></p></footer>

</body>
</html>
