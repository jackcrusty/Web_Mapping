<!DOCTYPE html>
<html>
  <head>
      <meta charset="UTF-8">
      <title>Berliner Straßenfeste 2019</title>
      <link rel="stylesheet" href="stylesheet.css">

      <!-- Map Integration Framework Leaflet -->
      <link rel="stylesheet" href="leaflet/leaflet.css">
      <script src="leaflet/leaflet.js"></script>  
  </head>

  <body>

      <h1> Berliner Festivals</h1>

      <div class="mapcontainer">
          <!-- Map Display -->
          <div id="mapid"></div>
      </div>

      <!-- Map Integration GeoJSON Javascript -->
      <script src="geojsonberlin.js" type="text/javascript"></script>

      <script>
          var mymap = L.map('mapid').setView([52.520, 13.404], 9);

          /* Map Use OSM Tiles */
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
              maxZoom: 18,
              attribution: 'Map data &copy; <a href="https://www.openstreetmap.org/">OpenStreetMap</a> contributors, ' +
                  '<a href="https://creativecommons.org/licenses/by-sa/2.0/">CC-BY-SA</a>, ' ,
              id: 'mapbox.streets'
          }).addTo(mymap);

          var design = {
              radius: 10,
              fillColor: "#ccc",
              color: "#000",
              weight: 1,
              opacity: 1,
              fillOpacity: 0.4
          };

          /* Read JSON Knots */
          function onEachFeature(feature, layer) {
              var popupContent = "Festival: " +
                  feature.properties.data.bezeichnung +
                  "<br><br>Von: " +
                  feature.properties.data.von +
                  " Bis: " +
                  feature.properties.data.bis +
                  "<br>Zeit: " +
                  feature.properties.data.zeit +
                  "<br><br>Kontakt: " +
                  feature.properties.data.mail +
                  "<br>Internet: " +
                  feature.properties.data.www;
              layer.bindPopup(popupContent);
          }

          /* Display JSON Points and Features */
          L.geoJSON(points, {
              pointToLayer: function (feature, latlng) {
                  return L.circleMarker(latlng, design);
              },
              onEachFeature: onEachFeature
          }).addTo(mymap);

      </script>

  </body>
</html>
